name: CI Quality Gates

# Runs on every PR targeting main and every push to main.
# The active repository ruleset is versioned in .github/rulesets/main.json.
# Keep the final "Quality Gate" job name stable because the ruleset requires it.

on:
  workflow_dispatch:
    inputs:
      changelog_branch:
        description: 'Optional bot changelog branch to verify with this workflow revision'
        type: string
      changelog_head:
        description: 'Exact 40-character changelog head; required with changelog_branch'
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # ── Build & Test ───────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Build
        run: go build -o "$RUNNER_TEMP/bin/" ./... ./.github/scripts/...

      - name: Build all release targets
        env:
          RELEASE_VERSION: ci
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-targets
        run: |
          RELEASE_BUILD_DATE="$(git show -s --format=%cs HEAD)"
          export RELEASE_BUILD_DATE
          go run ./.github/scripts/release-targets build

      - name: Vet
        run: go vet ./... ./.github/scripts/...

      - name: Test Go packages (race detection enabled)
        run: |
          go list ./... ./.github/scripts/... | grep -v '/tests/behavior$' > "$RUNNER_TEMP/go-packages.list"
          mapfile -t packages < "$RUNNER_TEMP/go-packages.list"
          go test -race -count=1 -coverprofile=coverage.out "${packages[@]}"

      - name: Test release automation helpers
        run: go test -race -count=1 ./.github/scripts/...

      - name: Test CLI behavior
        run: go test -trimpath -race -count=1 ./tests/behavior

      - name: Test Node dashboards
        run: node --test src/codex-dashboard/*.test.mjs src/dashboard-hub/*.test.mjs

      - name: Test local audit runner
        shell: pwsh
        run: ./.agents/skills/perfection/scripts/test-audit.ps1

      - name: Test migration credential parsing and policy
        shell: pwsh
        run: ./scripts/test-migration-credential.ps1

      - name: Test dashboard hub installer
        shell: pwsh
        run: ./tests/installer/test-dashboard-hub.ps1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  windows-installer:
    name: Dashboard installer (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Test Windows standalone launcher
        shell: pwsh
        env:
          NODE_OPTIONS: ""
        run: node --test src/codex-dashboard/launcher.test.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Test Windows PowerShell installer
        shell: pwsh
        run: ./tests/installer/test-dashboard-hub.ps1 -InstallerPowerShell "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe"
      - name: Test captured CLI descendants without a console
        shell: pwsh
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
        run: go test -count=1 -timeout=90s ./src -run '^Test(CapturedCommandWindows.*|RunGHCmdHonorsSuccessDeadlineAndCancellation|StatusCancellationAfterGitStarts|NewSSHConfigCommandBoundsPipeDrain)$'

  # ── Lint ───────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l . .github/scripts)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module tidiness
        run: |
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null 2>&1 || ! diff -q go.sum go.sum.bak >/dev/null 2>&1; then
            echo "::error::go.mod or go.sum not tidy. Run 'go mod tidy' and commit."
            diff go.mod.bak go.mod || true
            diff go.sum.bak go.sum || true
            exit 1
          fi

      - name: Validate main ruleset
        run: |
          go test ./.github/scripts/...
          go run .github/scripts/validate-main-ruleset.go

      - name: Validate changelog release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./.github/scripts/changelog-check

      - name: Install lint tools
        run: bash .github/scripts/install-quality-tools.sh lint

      - name: Staticcheck
        run: staticcheck ./... ./.github/scripts/...

      - name: Gocritic (anti-pattern detection)
        run: gocritic check ./... ./.github/scripts/...

      - name: Errcheck (unchecked errors)
        run: errcheck -exclude .errcheck_excludes ./... ./.github/scripts/...

      - name: Dead code detection
        run: |
          output=$(deadcode ./... ./.github/scripts/... 2>&1 || true)
          if [ -n "$output" ]; then
            echo "::error::Dead code detected:"
            echo "$output"
            exit 1
          fi

      - name: Vulnerability scan
        run: govulncheck ./... ./.github/scripts/...

      - name: No lint suppressions allowed
        run: |
          # Policy: zero suppression comments in codebase
          suppressions=$(grep -rn '//nolint\|//lint:ignore\|//nosec\|#nosec' --include='*.go' . || true)
          if [ -n "$suppressions" ]; then
            echo "::error::Lint suppression comments found (policy: no suppressions):"
            echo "$suppressions"
            exit 1
          fi

      - name: No anti-patterns allowed
        run: |
          # Policy: no fmt.Print* in production code (use writer injection)
          violations=$(grep -rn 'fmt\.Print' --include='*.go' . | grep -v '_test\.go' || true)
          if [ -n "$violations" ]; then
            echo "::error::fmt.Print* found in production code (use fmt.Fprint* with injected io.Writer):"
            echo "$violations"
            exit 1
          fi

      - name: Lint markdown
        run: |
          source .github/quality-tools.env
          npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" '**/*.md' '#node_modules' '#.agents' '#.github/agents'

  # ── Security Analysis ─────────────────────────────────────────
  security-analysis:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Skip dependency review outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Dependency review applies only to pull requests."

  # ── Quality Gates ──────────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - name: Install dashboard quality tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-quality"
          node .github/scripts/dashboard-quality/install.mjs 2>&1 | tee "$RUNNER_TEMP/dashboard-quality/install.log"

      - name: Test dashboard quality gate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-quality"
          node --test .github/scripts/dashboard-quality/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/dashboard-quality/fixtures.log"

      - name: Enforce dashboard JavaScript quality
        run: node .github/scripts/dashboard-quality/run.mjs "$RUNNER_TEMP/dashboard-quality"

      - name: Upload dashboard quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-quality
          if-no-files-found: error
          path: ${{ runner.temp }}/dashboard-quality
          retention-days: 14

      - name: Install quality tools
        run: bash .github/scripts/install-quality-tools.sh quality

      - name: Download coverage
        id: download
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage

      - name: Settle before retry
        if: steps.download.outcome != 'success'
        run: sleep 30

      - name: Retry coverage download
        if: steps.download.outcome != 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage

      - name: Verify coverage artifact
        run: |
          # Artifact downloads can complete ahead of blob visibility; allow
          # brief propagation lag before declaring the artifact lost.
          for attempt in 1 2 3 4 5 6; do
            if [ -f coverage.out ]; then break; fi
            echo "coverage.out not present yet (attempt $attempt/6)"
            sleep 10
          done
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out not found — artifact download may have failed"
            exit 1
          fi

      - name: "Enforce: coverage ≥ 70%"
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 70.0" | bc -l) )); then
            echo "::error::Coverage ${total}% is below 70% threshold"
            echo ""
            echo "Per-function breakdown:"
            go tool cover -func=coverage.out
            exit 1
          fi

      - name: "Enforce: cyclomatic complexity ≤ 10"
        run: |
          if ! command -v gocyclo &>/dev/null; then
            echo "::error::gocyclo not installed"
            exit 1
          fi
          violations=$(gocyclo -over 10 -ignore "_test\.go" . .github/scripts 2>&1 || true)
          if [ -n "$violations" ]; then
            count=$(echo "$violations" | wc -l)
            echo "::error::${count} function(s) exceed cyclomatic complexity 10:"
            echo "$violations"
            exit 1
          fi

      - name: "Enforce: cognitive complexity ≤ 15"
        run: |
          if ! command -v gocognit &>/dev/null; then
            echo "::error::gocognit not installed"
            exit 1
          fi
          violations=$(gocognit -over 15 -ignore "_test\.go" . .github/scripts 2>&1 || true)
          if [ -n "$violations" ]; then
            count=$(echo "$violations" | wc -l)
            echo "::error::${count} function(s) exceed cognitive complexity 15:"
            echo "$violations"
            exit 1
          fi

      - name: "Enforce: CRAP score < 30"
        shell: pwsh
        run: |
          . ./.agents/skills/perfection/scripts/perfection-audit.ps1
          Assert-CrapThreshold coverage.out 30.0

  # ── Mutation Testing ───────────────────────────────────────────
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install gremlins
        run: bash .github/scripts/install-quality-tools.sh mutation

      - name: Verify mutation threshold fixtures
        run: bash .github/scripts/test-mutation-gate.sh

      - name: "Enforce: mutation efficacy ≥ 90% and mutator coverage ≥ 90%"
        run: bash .github/scripts/run-mutation-gate.sh

  # Read-only review verification uses the default-branch helper for every PR.
  # Auto Release remains the sole automated requester for generated changelogs.
  codex-review:
    name: Current-head Codex Review
    if: github.event_name == 'pull_request' || startsWith(github.head_ref || github.ref_name, 'chore/changelog-') || inputs.changelog_branch != '' || inputs.changelog_head != ''
    runs-on: ubuntu-latest
    timeout-minutes: 44
    concurrency:
      # A release dispatch is authoritative and gets a run-specific lane. PR
      # events for one immutable head still replace their own stale verifier.
      group: codex-review-${{ github.event.pull_request.number || inputs.changelog_branch || github.ref_name }}-${{ inputs.changelog_head || github.event.pull_request.head.sha || github.sha }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'pull-request' }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog_branch != '' && github.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Require a clean current-head Codex review
        env:
          INPUT_BRANCH: ${{ inputs.changelog_branch }}
          INPUT_HEAD: ${{ inputs.changelog_head }}
          WORKFLOW_REF: ${{ github.ref_name }}
          WORKFLOW_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SETUP_AT: ${{ github.event.pull_request.updated_at }}
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_BRANCH: ${{ inputs.changelog_branch || github.head_ref || github.ref_name }}
          EXPECTED_HEAD: ${{ inputs.changelog_head || github.event.pull_request.head.sha || github.sha }}
        run: |
          if { [[ -n "$INPUT_BRANCH" ]] && [[ -z "$INPUT_HEAD" ]]; } || { [[ -z "$INPUT_BRANCH" ]] && [[ -n "$INPUT_HEAD" ]]; }; then
            echo "::error::Candidate verification requires both changelog_branch and changelog_head."
            exit 1
          fi
          # A changelog branch can only produce a gate for its own immutable head.
          if [[ "$WORKFLOW_REF" == chore/changelog-* ]] && [[ "$CHANGELOG_BRANCH" != "$WORKFLOW_REF" || "$EXPECTED_HEAD" != "$WORKFLOW_HEAD" ]]; then
            echo "::error::Changelog verification inputs cannot override this branch or head."
            exit 1
          fi
          review_scope=ordinary
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || { [[ "$PR_AUTHOR" == "github-actions[bot]" ]] && [[ "$CHANGELOG_BRANCH" == chore/changelog-* ]]; }; then
            review_scope=changelog
          fi
          REVIEW_SCOPE="$review_scope" go run ./.github/scripts/changelog-merge review

  credential-scan:
    name: Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install credential scanner
        run: bash .github/scripts/install-quality-tools.sh credentials
      - name: Test credential scanner fixtures
        run: go test -race -count=1 -timeout=90s ./.github/scripts/credential-scan -run '^TestGitleaks' -gitleaks-integration
      - name: Scan source and reachable history
        run: go run ./.github/scripts/credential-scan -report "$RUNNER_TEMP/credential-scope.json"

  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Detect performance workload changes
        id: scope
        run: node benchmarks/changed.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - name: Test performance gate
        run: node --test benchmarks/*.test.mjs
      - name: Measure critical local paths
        if: steps.scope.outputs.run == 'true'
        run: node benchmarks/run.mjs --out "$RUNNER_TEMP/performance"
      - name: Upload performance evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance
          retention-days: 30
          if-no-files-found: error

  # ── Final Gate ─────────────────────────────────────────────────
  # Single required status check for branch protection
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, windows-installer, lint, quality, mutation, security-analysis, dependency-review, codex-review, performance, credential-scan]
    steps:
      - name: Evaluate all gates
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Windows 5.1:  ${{ needs.windows-installer.result }}"
          echo "Lint:         ${{ needs.lint.result }}"
          echo "Quality:      ${{ needs.quality.result }}"
          echo "Mutation:     ${{ needs.mutation.result }}"
          echo "CodeQL:       ${{ needs.security-analysis.result }}"
          echo "Dependencies: ${{ needs.dependency-review.result }}"
          echo "Codex review: ${{ needs.codex-review.result }}"
          echo "Performance:  ${{ needs.performance.result }}"
          echo "Credentials:  ${{ needs.credential-scan.result }}"

          if [[ "${{ needs.build-and-test.result }}" != "success" || \
                "${{ needs.windows-installer.result }}" != "success" || \
                "${{ needs.lint.result }}" != "success" || \
                "${{ needs.quality.result }}" != "success" || \
                "${{ needs.mutation.result }}" != "success" || \
                "${{ needs.security-analysis.result }}" != "success" || \
                "${{ needs.dependency-review.result }}" != "success" || \
                "${{ needs.credential-scan.result }}" != "success" || \
                "${{ needs.performance.result }}" != "success" ]]; then
            echo "::error::One or more quality gates failed"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && \
                "$REF" != "refs/heads/$DEFAULT_BRANCH" && \
                "$REF_NAME" != chore/changelog-* ]]; then
            echo "::error::A non-changelog branch dispatch cannot publish the required Quality Gate"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "${{ needs.codex-review.result }}" != "success" ]]; then
            echo "::error::Every pull request requires a clean current-head Codex review"
            exit 1
          fi
          if [[ "${{ needs.codex-review.result }}" != "success" && "${{ needs.codex-review.result }}" != "skipped" ]]; then
            echo "::error::Current-head Codex review gate did not pass"
            exit 1
          fi
          echo "All quality gates passed ✅"
