name: Verify migration credential authentication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-migration-credential-${{ github.actor }}-${{ github.triggering_actor }}
  cancel-in-progress: false

jobs:
  trusted-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject an untrusted dispatch before exposing credentials
        shell: pwsh
        env:
          EXPECTED_REPOSITORY_ID: '1262580000'
          EXPECTED_SOURCE: HemSoft/gh-x
          EXPECTED_DESTINATION: hemsoft-dev/gh-x
        run: |
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REPOSITORY_ID -cne $env:EXPECTED_REPOSITORY_ID -or
              $env:GITHUB_REPOSITORY -cnotin @($env:EXPECTED_SOURCE, $env:EXPECTED_DESTINATION) -or
              $env:GITHUB_ACTOR -cne 'HemSoft' -or $env:GITHUB_TRIGGERING_ACTOR -cne 'HemSoft') {
            throw 'This check requires an owner-dispatched trusted main revision.'
          }
  verify:
    needs: trusted-dispatch
    if: >-
      github.repository_id == '1262580000' &&
      (github.repository == 'HemSoft/gh-x' || github.repository == 'hemsoft-dev/gh-x') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Replay authentication and secret-sanitization tests without credentials
        shell: pwsh
        run: ./scripts/test-migration-credential.ps1
      - name: Verify existing credential with read-only metadata requests
        shell: pwsh
        env:
          VERIFY_CREDENTIAL_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: >-
          ./scripts/verify-migration-credential.ps1
          -Provider GitHubToken
          -ExpectedRepositoryId 1262580000
          -OutputPath migration-credential-metadata.json
      - name: Upload public authentication metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-credential-metadata
          path: migration-credential-metadata.json
          if-no-files-found: error
          retention-days: 30
