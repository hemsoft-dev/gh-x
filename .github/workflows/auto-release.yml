name: Auto Release

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    concurrency:
      group: auto-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      checks: read
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Load trusted release helpers
        env:
          TRUSTED_HELPER_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags origin "$TRUSTED_HELPER_SHA"
          git show "$TRUSTED_HELPER_SHA:.github/scripts/release-plan/main.go" > "$RUNNER_TEMP/release-plan.go"
          git show "$TRUSTED_HELPER_SHA:.github/scripts/prepare-changelog-pr.sh" > "$RUNNER_TEMP/prepare-changelog-pr.sh"
          git show "$TRUSTED_HELPER_SHA:.github/scripts/release-targets/main.go" > "$RUNNER_TEMP/release-targets.go"
          git show "$TRUSTED_HELPER_SHA:.github/release-targets-legacy.json" > "$RUNNER_TEMP/release-targets-legacy.json"

      - name: Check whether release is needed
        id: check
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: go run "$RUNNER_TEMP/release-plan.go" check

      - name: Load existing release notes
        id: existing_release
        if: steps.check.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          response_headers=$(mktemp)
          if gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$response_headers"; then
            gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq '^HTTP/[^ ]+ 404 ' "$response_headers"; then
            echo "Tag ${RELEASE_TAG} has no GitHub Release; skipping reconciliation."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat "$response_headers"
            exit 1
          fi

      - name: Run tests
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        run: go test ./... -count=1

      - name: Determine next version
        if: steps.check.outputs.skip == 'false'
        id: version
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          VERSION_BASE_TAG: ${{ steps.check.outputs.version_base }}
        run: go run "$RUNNER_TEMP/release-plan.go" version

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        env:
          LATEST_TAG: ${{ steps.check.outputs.latest }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: go run "$RUNNER_TEMP/release-plan.go" notes

      - name: Prepare candidate changelog PR before publication
        id: changelog_pr
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_PUBLISHED: ${{ steps.existing_release.outputs.found == 'true' }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          go run "$RUNNER_TEMP/release-plan.go" changelog
          bash "$RUNNER_TEMP/prepare-changelog-pr.sh"
          git switch --detach "$RELEASE_SHA"

      - name: Build cross-platform binaries
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_OUTPUT_DIR: dist
        run: |
          RELEASE_BUILD_DATE="$(git show -s --format=%cs "$RELEASE_SHA")"
          export RELEASE_BUILD_DATE
          if [[ ! -f .github/release-targets.json ]]; then
            RELEASE_TARGET_MANIFEST="$RUNNER_TEMP/release-targets-legacy.json"
            export RELEASE_TARGET_MANIFEST
          fi
          go run "$RUNNER_TEMP/release-targets.go" build

      - name: Attest release binaries
        # Initial publication attests the complete set before any upload. A
        # tagged retry reuses those digests instead of signing under a later
        # workflow_run source identity.
        if: steps.check.outputs.skip == 'false'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: 'dist/*'

      - name: Create release
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
        run: go run "$RUNNER_TEMP/release-plan.go" create

      - name: Queue guarded changelog auto-merge and await completion
        if: steps.check.outputs.skip == 'false' || steps.existing_release.outputs.found == 'true'
        env:
          CHANGELOG_PR_URL: ${{ steps.changelog_pr.outputs.pr_url }}
          CHANGELOG_BRANCH: ${{ steps.changelog_pr.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.changelog_pr.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.check.outputs.release_tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          set -euo pipefail
          git switch --detach origin/main
          pr_url="$CHANGELOG_PR_URL"
          head_sha="$EXPECTED_HEAD"
          branch="$CHANGELOG_BRANCH"
          if [[ -z "$pr_url" ]]; then
            echo "CHANGELOG.md already records published ${RELEASE_TAG}."
            if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
              gh workflow run ci.yml --ref main
            fi
            exit 0
          fi
          # Only successful publication makes the planned candidate reviewable.
          actual_head=$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)
          if [[ "$actual_head" != "$head_sha" ]]; then
            echo "::error::PR $pr_url moved from prepared head $head_sha to $actual_head; leaving it unchanged."
            exit 1
          fi
          is_draft=$(gh pr view "$pr_url" --json isDraft --jq .isDraft)
          if [[ "$is_draft" == true ]]; then
            gh pr ready "$pr_url"
          elif [[ "$is_draft" != false ]]; then
            echo "::error::PR $pr_url returned an invalid draft state; leaving it unchanged."
            exit 1
          fi
          gh pr edit "$pr_url" --body "Records the published ${RELEASE_TAG} notes and advances the Unreleased comparison. Generated by the Auto Release workflow."
          if [[ -z "$CODEX_REVIEW_TOKEN" ]]; then
            echo "::error::PR $pr_url head $head_sha requester unavailable: configure CODEX_REVIEW_TOKEN for the connected HemSoft account. No bot review request was posted."
            exit 1
          fi
          # Only this serialized job requests reviews. The dedicated user token
          # is passed to this command; release/merge operations keep GH_TOKEN.
          GH_TOKEN="$CODEX_REVIEW_TOKEN" CHANGELOG_BRANCH="$branch" EXPECTED_HEAD="$head_sha" \
            go run ./.github/scripts/changelog-merge request
          # Bind recovery to this dispatch, not an old failed check for the head.
          if ! ci_run=$(gh api --method POST \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="$branch" --jq '.workflow_run_id'); then
            echo "::error::PR $pr_url expected head $head_sha could not create its authoritative CI run; leaving the pull request open."
            exit 1
          fi
          if [[ ! "$ci_run" =~ ^[0-9]+$ ]]; then
            echo "::error::PR $pr_url expected head $head_sha received invalid authoritative run ID '$ci_run'; leaving the pull request open."
            exit 1
          fi
          bash .github/scripts/verify-authoritative-run.sh \
            "$GITHUB_REPOSITORY" "$pr_url" "$head_sha" "$ci_run"

          CHANGELOG_BRANCH="$branch" EXPECTED_HEAD="$head_sha" \
            go run ./.github/scripts/changelog-merge enable
          # A queued auto-merge is not completion. The helper returns only after merge.
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${head_sha}" origin ":refs/heads/${branch}"
          fi
          gh workflow run ci.yml --ref main
